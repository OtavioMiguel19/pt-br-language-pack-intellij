libraries.node.text.ide=Bibliotecas cont\u00eam classes que adicionam diversas funcionalidades \u00e0s suas aplica\u00e7\u00f5es. \
  Bibliotecas tamb\u00e9m incluem arquivos-fonte e JavaDocs que podem ajud\u00e1-lo a desenvolver seus projetos.<br><br>\
  O IntelliJ IDEA usa bibliotecas para auxili\u00e1-lo com complemento de c\u00f3digo, valida\u00e7\u00e3o, destaque de erros, etc.<br><br>\
  Bibliotecas globais s\u00e3o referenciadas em todo o projeto e podem ser usadas por todos os m\u00f3dulos. \
  Al\u00e9m disso, est\u00e3o dispon\u00edveis para todos os projetos criados localmente no seu computador.<br><br>\
  Observe que bibliotecas globais n\u00e3o est\u00e3o dispon\u00edveis para quem voc\u00ea compartilhar o projeto. \
  Se estiver compartilhando o projeto com sua equipe, use bibliotecas de projeto.<br><br>\
  Expanda o n\u00f3 e selecione os itens filhos para gerenciar bibliotecas globais. <br><br>\
   Para anexar uma biblioteca a um m\u00f3dulo, selecione o m\u00f3dulo, clique na aba Depend\u00eancias, clique em Adicionar e especifique a localiza\u00e7\u00e3o da biblioteca.
libraries.node.text.module=Bibliotecas cont\u00eam classes que adicionam diversas funcionalidades \u00e0s suas aplica\u00e7\u00f5es. \
  Bibliotecas tamb\u00e9m incluem arquivos-fonte e JavaDocs que podem ajud\u00e1-lo a desenvolver seus projetos.<br><br>\
  O IntelliJ IDEA usa bibliotecas para auxili\u00e1-lo com complemento de c\u00f3digo, valida\u00e7\u00e3o, destaque de erros, etc.<br><br>\
  Bibliotecas de m\u00f3dulo s\u00e3o referenciadas apenas pelo m\u00f3dulo ao qual est\u00e3o anexadas. Expanda o n\u00f3 e selecione os itens filhos para gerenciar bibliotecas de m\u00f3dulo.<br><br>\
   Para anexar uma biblioteca a um m\u00f3dulo, selecione o m\u00f3dulo, clique na aba Depend\u00eancias, clique em Adicionar e especifique a localiza\u00e7\u00e3o da biblioteca.
libraries.node.text.project=Bibliotecas cont\u00eam classes que adicionam diversas funcionalidades \u00e0s suas aplica\u00e7\u00f5es. \
  Bibliotecas tamb\u00e9m incluem arquivos-fonte e JavaDocs que podem ajud\u00e1-lo a desenvolver seus projetos.<br><br>\
  O IntelliJ IDEA usa bibliotecas para auxili\u00e1-lo com complemento de c\u00f3digo, valida\u00e7\u00e3o, destaque de erros, etc.<br><br>\
  Bibliotecas de projeto s\u00e3o referenciadas em todo o projeto e podem ser usadas por todos os m\u00f3dulos. \
  Al\u00e9m disso, est\u00e3o dispon\u00edveis para todos com quem voc\u00ea compartilhar o projeto.<br><br>Expanda o n\u00f3 e selecione os itens filhos para gerenciar bibliotecas de projeto.<br><br>\
   Para anexar uma biblioteca a um m\u00f3dulo, selecione o m\u00f3dulo, clique na aba Depend\u00eancias, clique em Adicionar e especifique a localiza\u00e7\u00e3o da biblioteca.
