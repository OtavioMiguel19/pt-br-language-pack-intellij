environment.key.description.link.unlinked.project=Define se o IDE deve importar informa\u00e7\u00f5es do projeto a partir dos scripts de build dispon\u00edveis.\n\
O formato dos valores \u00e9 o \u00fanico 'all' ou uma lista separada por v\u00edrgulas de entradas como '<Sistema de build>:[import|skip]'.\n\
- Se 'all' for especificado, todos os scripts de build detectados ser\u00e3o usados para a importa\u00e7\u00e3o\n\
- Se '<Sistema de build>:import' for especificado, os scripts de build deste sistema ser\u00e3o usados no processo de importa\u00e7\u00e3o.\n\
- Se '<Sistema de build>:skip' for especificado, os scripts de build n\u00e3o ser\u00e3o usados e a notifica\u00e7\u00e3o sobre o uso desses scripts n\u00e3o ser\u00e1 exibida na execu\u00e7\u00e3o do IDE.\n\
Exemplo de valor para esta chave: "Gradle:import,Ant:skip"
