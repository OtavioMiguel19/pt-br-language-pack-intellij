# These properties are used, see UiInspectorAccessibilityInspection.description
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleActionNotNullInspection.description=Espera-se que a interface AccessibleAction seja implementada para a fun\u00e7\u00e3o "{0}". Ela permite que tecnologias assistivas, como leitores de tela e controle por voz, executem a\u00e7\u00f5es sem interagir diretamente com o componente. Exemplos t\u00edpicos de a\u00e7\u00f5es incluem clicar em um bot\u00e3o, ativar uma caixa de sele\u00e7\u00e3o ou exibir um menu de contexto.\n\nComo corrigir:\nCertifique-se de que o AccessibleContext do componente implemente a interface AccessibleAction com todas as a\u00e7\u00f5es dispon\u00edveis para o componente.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleEditableTextNotNullInspection.description=Espera-se que a interface AccessibleEditableText seja implementada com base no estado acess\u00edvel "edit\u00e1vel" e na fun\u00e7\u00e3o "{0}". Ela permite que tecnologias assistivas, como leitores de tela e controle por voz, interajam com o componente de texto.\n\nComo corrigir:\nCertifique-se de que o AccessibleContext do componente implemente a interface AccessibleEditableText. Se o componente n\u00e3o deve ser edit\u00e1vel, verifique se o m\u00e9todo AccessibleContext.getAccessibleStateSet() n\u00e3o retorna AccessibleState.EDITABLE.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleTextNotNullInspection.description=Espera-se que a interface AccessibleText seja implementada para a fun\u00e7\u00e3o acess\u00edvel "{0}". Ela permite que tecnologias assistivas, como leitores de tela e controle por voz, acessem o conte\u00fado de texto do componente.\n\nComo corrigir:\nCertifique-se de que o AccessibleContext do componente implemente a interface AccessibleText. Se o componente de texto for um texto est\u00e1tico simples e n\u00e3o deve ser interativo, considere alterar a fun\u00e7\u00e3o acess\u00edvel para "label" e forneça o conte\u00fado de texto no nome acess\u00edvel.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleNameAndDescriptionNotEqualInspection.description=As propriedades de nome e descri\u00e7\u00e3o acess\u00edveis n\u00e3o devem ser iguais entre si. O nome \u00e9 usado para transmitir o prop\u00f3sito principal do componente, enquanto a descri\u00e7\u00e3o pode ser usada para informa\u00e7\u00f5es adicionais, como instru\u00e7\u00f5es ou coment\u00e1rios.\n\nComo corrigir:\nSe a descri\u00e7\u00e3o acess\u00edvel duplica o nome acess\u00edvel e n\u00e3o h\u00e1 informa\u00e7\u00f5es adicionais adequadas para a descri\u00e7\u00e3o, mantenha apenas o nome. Caso contr\u00e1rio, divida o texto nas duas propriedades adequadamente.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleNameNotEmptyForFocusableComponentsInspection.description=O nome acess\u00edvel n\u00e3o deve estar vazio para componentes foc\u00e1veis com a fun\u00e7\u00e3o "{0}". Caso contr\u00e1rio, usu\u00e1rios de tecnologias assistivas provavelmente n\u00e3o conseguir\u00e3o interagir com eles. Por exemplo, usu\u00e1rios de leitores de tela podem n\u00e3o entender o prop\u00f3sito deste componente, e usu\u00e1rios de controle por voz n\u00e3o poder\u00e3o ativ\u00e1-lo usando o nome.\n\nComo corrigir:\nExistem algumas op\u00e7\u00f5es:\n1. Defina um nome para o componente usando o m\u00e9todo getAccessibleContext().setAccessibleName() ou sobrescreva o m\u00e9todo getAccessibleName() no AccessibleContext do componente.\n2. O nome acess\u00edvel tamb\u00e9m pode ser definido implicitamente usando o m\u00e9todo JLabel.setLabelFor(Component), definindo a propriedade tooltip ou text do componente.\n3. Se o componente for puramente decorativo e n\u00e3o houver um nome acess\u00edvel adequado para ele, certifique-se de que n\u00e3o seja foc\u00e1vel e que sua fun\u00e7\u00e3o acess\u00edvel o represente corretamente.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleNameNotEmptyForIcon.description=\u00cdcones devem ter um nome acess\u00edvel que descreva o que representam. Isso permite que tecnologias assistivas, como leitores de tela, transmitam adequadamente o significado do \u00edcone para usu\u00e1rios que n\u00e3o podem v\u00ea-lo visualmente.\n\nComo corrigir:\nDefina um nome acess\u00edvel descritivo para o \u00edcone usando o m\u00e9todo getAccessibleContext().setAccessibleName(). Se o \u00edcone for puramente decorativo e n\u00e3o transmitir nenhuma informa\u00e7\u00e3o, o nome acess\u00edvel pode ser deixado vazio.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleStateSetContainsFocusableInspection.description=O componente est\u00e1 sem o estado acess\u00edvel "foc\u00e1vel". Com base na fun\u00e7\u00e3o acess\u00edvel "{0}", espera-se que o componente seja foc\u00e1vel pelo teclado para permitir a intera\u00e7\u00e3o de usu\u00e1rios que dependem apenas do teclado para trabalhar com a IDE.\n\nComo corrigir:\nCertifique-se de que o componente seja foc\u00e1vel chamando setFocusable(true) no componente e verificando que ele pode ser alcan\u00e7ado usando a navega\u00e7\u00e3o Tab/Shift-Tab. Se o componente n\u00e3o for interativo e n\u00e3o deve ser foc\u00e1vel, considere alterar sua fun\u00e7\u00e3o acess\u00edvel para uma fun\u00e7\u00e3o n\u00e3o interativa que represente melhor seu prop\u00f3sito, como painel ou label.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.AccessibleValueNotNullInspection.description=Espera-se que a interface AccessibleValue seja implementada para a fun\u00e7\u00e3o acess\u00edvel "{0}". Ela permite que tecnologias assistivas, como leitores de tela, determinem e interajam com o valor do componente.\n\nComo corrigir:\nCertifique-se de que o AccessibleContext do componente implemente a interface AccessibleValue. Para componentes altern\u00e1veis como caixas de sele\u00e7\u00e3o ou bot\u00f5es de op\u00e7\u00e3o, o valor 0 deve ser retornado para o estado desativado e 1 para o estado ativado.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.ImplementsAccessibleInterfaceInspection.description=Todos os componentes de UI devem implementar a interface Accessible para fornecer metadados de acessibilidade para tecnologias assistivas, como leitores de tela e controle por voz.\n\nComo corrigir:\nImplemente a interface Accessible para o componente e forneça uma implementa\u00e7\u00e3o adequada de AccessibleContext que descreva a fun\u00e7\u00e3o, o estado e outras propriedades do componente. Para componentes puramente decorativos (por exemplo, separadores), \u00e9 aceit\u00e1vel n\u00e3o implementar a interface Accessible, mas ainda \u00e9 recomendado.
# suppress inspection "UnusedProperty"
ui.inspector.accessibility.audit.ComponentWithIconHasNonDefaultAccessibleNameInspection.description=Componentes com \u00edcones devem ter nomes acess\u00edveis que descrevam tanto o \u00edcone quanto o conte\u00fado de texto, em vez de apenas o texto, exceto quando o \u00edcone for puramente decorativo e n\u00e3o transmitir nenhuma informa\u00e7\u00e3o.\n\nComo corrigir:\nDefina um nome acess\u00edvel que descreva tanto o \u00edcone quanto o texto usando o m\u00e9todo getAccessibleContext().setAccessibleName() ou sobrescreva getAccessibleName() do AccessibleContext do componente.

