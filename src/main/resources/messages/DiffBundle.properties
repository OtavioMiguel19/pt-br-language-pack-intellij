dirdiff.filter.help.description=<p>Para incluir arquivos, insira um padr\u00e3o correspondente.</p><p>Para excluir arquivos, adicione <code>!</code> antes do seu padr\u00e3o.</p><p>Use <code>\\&</code> e <code>|</code> para combinar v\u00e1rios filtros com opera\u00e7\u00f5es <code>AND<code/> e <code>OR<code/>, respectivamente. </p><p><b>Exemplos:</b></p><ul><li><code>*.txt</code> valida todos os caminhos que terminam com .txt.</li><li><code>!build/*</code> exclui todos os arquivos localizados dentro do diret\u00f3rio <code>build</code>.</li><li><code>*.txt\\&!build/*</code> valida todos os caminhos que terminam com <code>.txt</code> e n\u00e3o est\u00e3o localizados dentro do diret\u00f3rio <code>build</code>.</li></ul>
