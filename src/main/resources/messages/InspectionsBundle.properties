inspection.command.line.explanation=Par\u00e2metros esperados: <project_file_path> <inspection_profile> <output_path> [<options>]\n\
  <inspection_profile> -- um nome de perfil configurado no projeto ou localmente ou um caminho para um perfil de inspe\u00e7\u00e3o; pode ser omitido quando um dos -e|-profileName|-profilePath \u00e9 usado\n\
  Op\u00e7\u00f5es dispon\u00edveis:\n \
    -d <directory_path>  --  diret\u00f3rio para inspecionar, o padr\u00e3o \u00e9 o projeto inteiro\n\
    -e                   --  usar o perfil de inspe\u00e7\u00e3o definido para o projeto\n\
    -v[0|1|2]            --  n\u00edvel de detalhamento. 0 - silencioso, 1 - detalhado, 2 - mais detalhado\n\
    -profileName         --  nome de um perfil definido no projeto\n\
    -profilePath         --  caminho absoluto para um arquivo de perfil\n\
    -format              --  formato de sa\u00edda do relat\u00f3rio. Um de xml|json|plain, o padr\u00e3o \u00e9 xml\n\
    -changes             --  inspecionar altera\u00e7\u00f5es n\u00e3o confirmadas e relatar novos problemas

